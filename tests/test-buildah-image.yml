name: Test buildah-image input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.buildah-image" << 'EOF'
          FROM busybox:latest
          CMD ["echo", "buildah-image test"]
          EOF

      - id: build
        uses: .
        with:
          image: buildah-image-test
          tags: latest
          containerfiles: Containerfile.buildah-image
          buildah-image: quay.io/buildah/stable
          extra-args: |
            --pull

      - name: Assert image output
        env:
          ACTUAL_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "actual image: $ACTUAL_IMAGE"
          if [ "$ACTUAL_IMAGE" != "buildah-image-test" ]; then
            echo "FAIL: expected image to be 'buildah-image-test', got '$ACTUAL_IMAGE'"
            exit 1
          fi
          echo "PASS: image output is correct"

      - name: Assert tags output
        env:
          ACTUAL_TAGS: ${{ steps.build.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL_TAGS"
          if [ -z "$ACTUAL_TAGS" ]; then
            echo "FAIL: expected tags to be non-empty"
            exit 1
          fi
          echo "PASS: tags output is non-empty"

      - name: Assert digest output
        env:
          ACTUAL_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "actual digest: $ACTUAL_DIGEST"
          if [ -z "$ACTUAL_DIGEST" ]; then
            echo "FAIL: expected digest to be non-empty"
            exit 1
          fi
          echo "PASS: digest output is non-empty"
