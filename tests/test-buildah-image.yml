name: Test Buildah Image Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock buildah on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-buildah" "$HOME/.local/bin/buildah"
          chmod +x "$HOME/.local/bin/buildah"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mock buildah
        run: |
          which buildah
          buildah version

      - name: Create a Containerfile for buildah-image test
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.buildah" << 'EOF'
          FROM busybox:latest
          LABEL test=buildah-image-input
          CMD ["echo", "buildah image input test"]
          EOF

      - id: build
        name: Build image specifying buildah-image input
        uses: .
        with:
          image: buildah-image-test
          tags: latest
          containerfiles: ./Containerfile.buildah
          buildah-image: quay.io/buildah/stable
          oci: 'false'
          tls-verify: 'false'

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "buildah-image-test" ]; then
            echo "FAIL: expected image='buildah-image-test', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output correct"

      - name: Assert image-with-tag output
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "buildah-image-test:latest" ]; then
            echo "FAIL: expected image-with-tag='buildah-image-test:latest', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag output correct"

      - name: Assert digest output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected non-empty digest output"
            exit 1
          fi
          echo "PASS: digest output non-empty"
