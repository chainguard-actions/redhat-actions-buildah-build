name: Test Multiple Tags Build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock buildah on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-buildah" "$HOME/.local/bin/buildah"
          chmod +x "$HOME/.local/bin/buildah"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mock buildah
        run: |
          which buildah
          buildah version

      - name: Create a simple Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.multi" << 'EOF'
          FROM busybox:latest
          LABEL test=multi-tag
          CMD ["echo", "multi-tag build"]
          EOF

      - id: build
        name: Build image with multiple tags
        uses: .
        with:
          image: multi-tag-image
          tags: latest v1.0.0 stable
          containerfiles: ./Containerfile.multi
          oci: 'false'
          tls-verify: 'false'

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "multi-tag-image" ]; then
            echo "FAIL: expected image='multi-tag-image', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output correct"

      - name: Assert tags output contains all tags
        env:
          TAGS: ${{ steps.build.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: expected non-empty tags output"
            exit 1
          fi
          echo "PASS: tags output non-empty"

      - name: Assert image-with-tag uses first tag
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "multi-tag-image:latest" ]; then
            echo "FAIL: expected image-with-tag='multi-tag-image:latest', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag uses first tag"
