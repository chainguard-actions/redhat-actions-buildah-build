name: Test build with multiple tags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image with multiple tags
        id: build
        uses: .
        with:
          image: multi-tag-image
          tags: latest v1.0.0 stable
          containerfiles: tests/fixtures/Containerfile
          extra-args: |
            --pull

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "multi-tag-image" ]; then
            echo "FAIL: expected image='multi-tag-image', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output is correct"

      - name: Assert image-with-tag uses first tag
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "multi-tag-image:latest" ]; then
            echo "FAIL: expected image-with-tag='multi-tag-image:latest', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag uses first tag"

      - name: Assert all tags are present in local storage
        run: |
          echo "Checking that all tags exist in local image storage..."
          buildah images
          for tag in latest v1.0.0 stable; do
            if buildah images | grep -F "multi-tag-image" | grep -F "$tag"; then
              echo "PASS: tag '${tag}' found"
            else
              echo "FAIL: tag '${tag}' not found in images"
              buildah images
              exit 1
            fi
          done
