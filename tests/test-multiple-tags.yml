name: Test multiple tags build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.multitag" << 'EOF'
          FROM busybox:latest
          CMD ["echo", "multi-tag test"]
          EOF

      - id: build
        uses: .
        with:
          image: multi-tag-image
          tags: latest v1 v1.0
          containerfiles: Containerfile.multitag
          extra-args: |
            --pull

      - name: Assert image output
        env:
          ACTUAL_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "actual image: $ACTUAL_IMAGE"
          if [ "$ACTUAL_IMAGE" != "multi-tag-image" ]; then
            echo "FAIL: expected image to be 'multi-tag-image', got '$ACTUAL_IMAGE'"
            exit 1
          fi
          echo "PASS: image output is correct"

      - name: Assert tags output contains all tags
        env:
          ACTUAL_TAGS: ${{ steps.build.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL_TAGS"
          if [ -z "$ACTUAL_TAGS" ]; then
            echo "FAIL: expected tags to be non-empty"
            exit 1
          fi
          echo "PASS: tags output is non-empty"

      - name: Assert image-with-tag uses first tag
        env:
          ACTUAL_IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "actual image-with-tag: $ACTUAL_IMAGE_WITH_TAG"
          if [ "$ACTUAL_IMAGE_WITH_TAG" != "multi-tag-image:latest" ]; then
            echo "FAIL: expected image-with-tag to be 'multi-tag-image:latest', got '$ACTUAL_IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag uses first tag"
