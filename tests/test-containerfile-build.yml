name: Test Containerfile Build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock buildah on PATH
        run: |
          # Create a local bin directory and put mock buildah there
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-buildah" "$HOME/.local/bin/buildah"
          chmod +x "$HOME/.local/bin/buildah"
          # Prepend to PATH so it takes precedence over any system buildah
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mock buildah
        run: |
          which buildah
          buildah version

      - name: Create a simple Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile" << 'EOF'
          FROM busybox:latest
          LABEL test=containerfile-build
          CMD ["echo", "hello from buildah"]
          EOF

      - id: build
        name: Build image from Containerfile
        uses: .
        with:
          image: test-image
          tags: latest
          containerfiles: ./Containerfile
          oci: 'false'
          tls-verify: 'false'

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "test-image" ]; then
            echo "FAIL: expected image='test-image', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output correct"

      - name: Assert tags output
        env:
          TAGS: ${{ steps.build.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          if [ -z "$TAGS" ]; then
            echo "FAIL: expected non-empty tags output"
            exit 1
          fi
          echo "PASS: tags output non-empty"

      - name: Assert image-with-tag output
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "test-image:latest" ]; then
            echo "FAIL: expected image-with-tag='test-image:latest', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag output correct"

      - name: Assert digest output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected non-empty digest output"
            exit 1
          fi
          echo "PASS: digest output non-empty"
