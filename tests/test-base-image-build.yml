name: Test base image build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install buildah
        run: |
          if ! command -v buildah &>/dev/null; then
            sudo apt-get update -y -qq
            sudo apt-get install -y buildah fuse-overlayfs
          fi
          buildah version

      - name: Create test content
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-content"
          echo "hello world" > "$GITHUB_WORKSPACE/test-content/hello.txt"

      - id: build
        uses: .
        continue-on-error: true
        with:
          image: base-image-test
          tags: latest
          base-image: busybox:latest
          content: ./test-content
          entrypoint: /bin/sh
          port: '8080'
          workdir: /app

      - name: Assert outputs or graceful failure
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.build.outputs.tags }}
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          echo "tags: $TAGS"
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGE" ]; then
              echo "FAIL: action succeeded but image output is empty"
              exit 1
            fi
            if [ "$IMAGE" != "base-image-test" ]; then
              echo "FAIL: expected image 'base-image-test', got '$IMAGE'"
              exit 1
            fi
            if [ -z "$TAGS" ]; then
              echo "FAIL: action succeeded but tags output is empty"
              exit 1
            fi
            if ! echo "$TAGS" | grep -q "latest"; then
              echo "FAIL: expected 'latest' in tags"
              exit 1
            fi
            if [ "$IMAGE_WITH_TAG" != "base-image-test:latest" ]; then
              echo "FAIL: expected 'base-image-test:latest', got '$IMAGE_WITH_TAG'"
              exit 1
            fi
            echo "PASS: build succeeded with correct outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (buildah not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
