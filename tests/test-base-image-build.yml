name: Test base image build (no Containerfile)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build image from base image
        id: build
        uses: .
        with:
          image: scratch-image
          tags: v1
          base-image: busybox:latest
          entrypoint: |
            echo
            hello
          workdir: /app
          squash: 'true'

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "scratch-image" ]; then
            echo "FAIL: expected image='scratch-image', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output is correct"

      - name: Assert image-with-tag output
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "scratch-image:v1" ]; then
            echo "FAIL: expected image-with-tag='scratch-image:v1', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag output is correct"

      - name: Assert digest output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected digest to be non-empty"
            exit 1
          fi
          echo "PASS: digest output is non-empty"

      - name: Assert image exists in local storage
        run: |
          echo "Checking image exists in local storage..."
          if buildah images | grep -q "scratch-image"; then
            echo "PASS: image found in local storage"
          else
            echo "FAIL: image not found in local storage"
            buildah images
            exit 1
          fi
