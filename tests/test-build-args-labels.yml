name: Test Build Args and Labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock buildah on PATH
        run: |
          mkdir -p "$HOME/.local/bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-buildah" "$HOME/.local/bin/buildah"
          chmod +x "$HOME/.local/bin/buildah"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify mock buildah
        run: |
          which buildah
          buildah version

      - name: Create a Containerfile that uses build args
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.args" << 'EOF'
          FROM busybox:latest
          ARG APP_VERSION=unknown
          ARG APP_NAME=myapp
          LABEL app.version=$APP_VERSION
          LABEL app.name=$APP_NAME
          ENV APP_VERSION=$APP_VERSION
          CMD ["echo", "build args test"]
          EOF

      - id: build
        name: Build image with build args and labels
        uses: .
        with:
          image: args-label-image
          tags: latest
          containerfiles: ./Containerfile.args
          build-args: |
            APP_VERSION=1.2.3
            APP_NAME=testapp
          labels: |
            org.opencontainers.image.title=Test Image
            org.opencontainers.image.version=1.2.3
          oci: 'false'
          tls-verify: 'false'

      - name: Assert image output
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "image: $IMAGE"
          if [ "$IMAGE" != "args-label-image" ]; then
            echo "FAIL: expected image='args-label-image', got '$IMAGE'"
            exit 1
          fi
          echo "PASS: image output correct"

      - name: Assert image-with-tag output
        env:
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
        run: |
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$IMAGE_WITH_TAG" != "args-label-image:latest" ]; then
            echo "FAIL: expected image-with-tag='args-label-image:latest', got '$IMAGE_WITH_TAG'"
            exit 1
          fi
          echo "PASS: image-with-tag output correct"

      - name: Assert digest output
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "digest: $DIGEST"
          if [ -z "$DIGEST" ]; then
            echo "FAIL: expected non-empty digest output"
            exit 1
          fi
          echo "PASS: digest output non-empty"
