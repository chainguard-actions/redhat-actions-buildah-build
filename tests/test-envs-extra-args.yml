name: Test envs and extra-args inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install buildah
        run: |
          if ! command -v buildah &>/dev/null; then
            sudo apt-get update -y -qq
            sudo apt-get install -y buildah fuse-overlayfs
          fi
          buildah version

      - name: Create test Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.envs" << 'EOF'
          FROM busybox:latest
          ENV MY_VAR=default
          RUN echo "MY_VAR is $MY_VAR"
          EOF

      - id: build
        uses: .
        continue-on-error: true
        with:
          image: envs-test-image
          tags: latest
          containerfiles: ./Containerfile.envs
          context: .
          envs: |
            MY_VAR=hello
            ANOTHER_VAR=world

      - name: Assert outputs or graceful failure
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.build.outputs.tags }}
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          echo "tags: $TAGS"
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGE" ]; then
              echo "FAIL: action succeeded but image output is empty"
              exit 1
            fi
            if [ "$IMAGE" != "envs-test-image" ]; then
              echo "FAIL: expected image 'envs-test-image', got '$IMAGE'"
              exit 1
            fi
            if [ -z "$TAGS" ]; then
              echo "FAIL: action succeeded but tags output is empty"
              exit 1
            fi
            if ! echo "$TAGS" | grep -q "latest"; then
              echo "FAIL: expected 'latest' in tags"
              exit 1
            fi
            if [ "$IMAGE_WITH_TAG" != "envs-test-image:latest" ]; then
              echo "FAIL: expected 'envs-test-image:latest', got '$IMAGE_WITH_TAG'"
              exit 1
            fi
            echo "PASS: build succeeded with correct outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (buildah not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
