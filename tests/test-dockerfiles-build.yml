name: Test Dockerfiles Envs Port Layers Build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure storage for rootless/container use
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '[storage]\ndriver = "vfs"\n' > "$HOME/.config/containers/storage.conf"
          cat "$HOME/.config/containers/storage.conf"

      - name: Create Dockerfile for dockerfiles alias test
        run: |
          printf 'FROM busybox:latest\nENV APP_ENV=test\nEXPOSE 8080\nRUN echo "dockerfiles alias test"\n' \
            > "$GITHUB_WORKSPACE/Dockerfile.test"
          cat "$GITHUB_WORKSPACE/Dockerfile.test"

      - id: build
        uses: .
        continue-on-error: true
        env:
          STORAGE_DRIVER: vfs
          BUILDAH_ISOLATION: chroot
        with:
          image: dockerfiles-test-image
          tags: latest
          dockerfiles: ./Dockerfile.test
          context: .
          envs: |
            APP_ENV=test
            APP_VERSION=1.0.0
          port: |
            8080
            9090
          layers: 'true'
          disable-fuse-overlayfs: 'true'

      - name: Assert build outcome
        env:
          OUTCOME: ${{ steps.build.outcome }}
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.build.outputs.tags }}
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          echo "tags: $TAGS"
          echo "image-with-tag: $IMAGE_WITH_TAG"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGE" ]; then
              echo "FAIL: build succeeded but image output is empty"
              exit 1
            fi
            if [ "$IMAGE" != "dockerfiles-test-image" ]; then
              echo "FAIL: expected image to be 'dockerfiles-test-image', got '$IMAGE'"
              exit 1
            fi
            if [ -z "$TAGS" ]; then
              echo "FAIL: build succeeded but tags output is empty"
              exit 1
            fi
            if ! echo "$TAGS" | grep -q "latest"; then
              echo "FAIL: expected tags to contain 'latest'"
              exit 1
            fi
            if [ -z "$IMAGE_WITH_TAG" ]; then
              echo "FAIL: build succeeded but image-with-tag output is empty"
              exit 1
            fi
            if ! echo "$IMAGE_WITH_TAG" | grep -q "dockerfiles-test-image"; then
              echo "FAIL: expected image-with-tag to contain 'dockerfiles-test-image'"
              exit 1
            fi
            if [ -z "$DIGEST" ]; then
              echo "FAIL: build succeeded but digest output is empty"
              exit 1
            fi
            echo "PASS: dockerfiles/envs/port/layers build succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (buildah/podman not available or insufficient privileges in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
