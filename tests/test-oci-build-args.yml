name: Test OCI format build with build-args and labels
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install buildah
        run: |
          if ! command -v buildah &>/dev/null; then
            sudo apt-get update -y -qq
            sudo apt-get install -y buildah fuse-overlayfs
          fi
          buildah version

      - name: Create test Containerfile with build args
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.oci" << 'EOF'
          FROM busybox:latest
          ARG APP_VERSION=unknown
          ARG APP_ENV=production
          LABEL version=$APP_VERSION
          LABEL environment=$APP_ENV
          RUN echo "Building version $APP_VERSION for $APP_ENV"
          EOF

      - id: build
        uses: .
        continue-on-error: true
        with:
          image: oci-test-image
          tags: v2.0.0
          containerfiles: ./Containerfile.oci
          context: .
          oci: 'true'
          build-args: |
            APP_VERSION=2.0.0
            APP_ENV=test
          labels: |
            org.opencontainers.image.title=OCI Test Image
            org.opencontainers.image.version=2.0.0

      - name: Assert outputs or graceful failure
        env:
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.build.outputs.tags }}
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          echo "tags: $TAGS"
          echo "image-with-tag: $IMAGE_WITH_TAG"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGE" ]; then
              echo "FAIL: action succeeded but image output is empty"
              exit 1
            fi
            if [ "$IMAGE" != "oci-test-image" ]; then
              echo "FAIL: expected image 'oci-test-image', got '$IMAGE'"
              exit 1
            fi
            if [ -z "$TAGS" ]; then
              echo "FAIL: action succeeded but tags output is empty"
              exit 1
            fi
            if ! echo "$TAGS" | grep -q "v2.0.0"; then
              echo "FAIL: expected 'v2.0.0' in tags"
              exit 1
            fi
            if [ "$IMAGE_WITH_TAG" != "oci-test-image:v2.0.0" ]; then
              echo "FAIL: expected 'oci-test-image:v2.0.0', got '$IMAGE_WITH_TAG'"
              exit 1
            fi
            echo "PASS: build succeeded with correct outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (buildah not supported in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
