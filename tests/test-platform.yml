name: Test platform and platforms inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a simple Containerfile
        run: |
          cat > "$GITHUB_WORKSPACE/Containerfile.platform" << 'EOF'
          FROM busybox:latest
          CMD ["echo", "platform test"]
          EOF

      - id: build
        uses: .
        with:
          image: platform-test-image
          tags: latest
          containerfiles: Containerfile.platform
          platform: linux/amd64
          platforms: linux/amd64,linux/arm64
          extra-args: |
            --pull

      - name: Assert image output
        env:
          ACTUAL_IMAGE: ${{ steps.build.outputs.image }}
        run: |
          echo "actual image: $ACTUAL_IMAGE"
          if [ "$ACTUAL_IMAGE" != "platform-test-image" ]; then
            echo "FAIL: expected image to be 'platform-test-image', got '$ACTUAL_IMAGE'"
            exit 1
          fi
          echo "PASS: image output is correct"

      - name: Assert tags output
        env:
          ACTUAL_TAGS: ${{ steps.build.outputs.tags }}
        run: |
          echo "actual tags: $ACTUAL_TAGS"
          if [ -z "$ACTUAL_TAGS" ]; then
            echo "FAIL: expected tags to be non-empty"
            exit 1
          fi
          echo "PASS: tags output is non-empty"
