name: Test OCI Format Build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure storage for rootless/container use
        run: |
          mkdir -p "$HOME/.config/containers"
          printf '[storage]\ndriver = "vfs"\n' > "$HOME/.config/containers/storage.conf"
          cat "$HOME/.config/containers/storage.conf"

      - name: Create Containerfile for OCI build
        run: |
          printf 'FROM busybox:latest\nARG APP_VERSION=unknown\nLABEL org.opencontainers.image.version=$APP_VERSION\nRUN echo "OCI build test"\n' \
            > "$GITHUB_WORKSPACE/Containerfile.oci"
          cat "$GITHUB_WORKSPACE/Containerfile.oci"

      - id: build
        uses: .
        continue-on-error: true
        env:
          STORAGE_DRIVER: vfs
          BUILDAH_ISOLATION: chroot
        with:
          image: oci-test-image
          tags: latest
          containerfiles: ./Containerfile.oci
          context: .
          oci: 'true'
          labels: |
            org.opencontainers.image.title=OCI Test Image
            org.opencontainers.image.description=Test image built in OCI format
          annotations: |
            org.opencontainers.image.version=1.0.0
          build-args: |
            APP_VERSION=1.0.0
          disable-fuse-overlayfs: 'true'

      - name: Assert build outcome
        env:
          OUTCOME: ${{ steps.build.outcome }}
          IMAGE: ${{ steps.build.outputs.image }}
          TAGS: ${{ steps.build.outputs.tags }}
          IMAGE_WITH_TAG: ${{ steps.build.outputs.image-with-tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "outcome: $OUTCOME"
          echo "image: $IMAGE"
          echo "tags: $TAGS"
          echo "image-with-tag: $IMAGE_WITH_TAG"
          echo "digest: $DIGEST"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$IMAGE" ]; then
              echo "FAIL: build succeeded but image output is empty"
              exit 1
            fi
            if [ "$IMAGE" != "oci-test-image" ]; then
              echo "FAIL: expected image to be 'oci-test-image', got '$IMAGE'"
              exit 1
            fi
            if [ -z "$TAGS" ]; then
              echo "FAIL: build succeeded but tags output is empty"
              exit 1
            fi
            if ! echo "$TAGS" | grep -q "latest"; then
              echo "FAIL: expected tags to contain 'latest'"
              exit 1
            fi
            if [ -z "$IMAGE_WITH_TAG" ]; then
              echo "FAIL: build succeeded but image-with-tag output is empty"
              exit 1
            fi
            if ! echo "$IMAGE_WITH_TAG" | grep -q "oci-test-image"; then
              echo "FAIL: expected image-with-tag to contain 'oci-test-image'"
              exit 1
            fi
            if [ -z "$DIGEST" ]; then
              echo "FAIL: build succeeded but digest output is empty"
              exit 1
            fi
            echo "PASS: OCI format build succeeded with valid outputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: build failed gracefully (buildah/podman not available or insufficient privileges in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
