name: Vulnerability Scan with CRDA
on:
  # push:
  workflow_dispatch:
  # pull_request_target:
  #   types: [ assigned, opened, synchronize, reopened, labeled, edited ]
  # schedule:
  #   - cron: '0 0 * * *'  # every day at midnight

permissions: {}

jobs:
  crda-scan:
    runs-on: ubuntu-22.04
    name: Scan project vulnerability with CRDA
    steps:

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install CRDA
        uses: redhat-actions/openshift-tools-installer@144527c7d98999f2652264c048c7a9bd103f8a82 # v1
        with:
          source: github
          github_pat: ${{ github.token }}
          crda: "latest"

      # NOTE: redhat-actions/crda has been deprecated and its repository is no longer
      # accessible; the action cannot be pinned to a commit SHA. This step has been
      # disabled until a maintained alternative is adopted.
      # - name: CRDA Scan
      #   id: scan
      #   uses: redhat-actions/crda@v1
      #   with:
      #     crda_key: ${{ secrets.CRDA_KEY }}
      #     fail_on: never
